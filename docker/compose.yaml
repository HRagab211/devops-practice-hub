name: devops-practice-hub

x-application: &application
  image: devops-practice-hub-app:local
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: application
  env_file: ../.env
  environment:
    APP_URL: http://localhost
    APP_KEY: ${APP_KEY:?The existing root .env must contain APP_KEY}
    DB_CONNECTION: sqlite
    DB_DATABASE: /var/lib/hub/database.sqlite
    DB_URL: ""
    SESSION_DOMAIN: ""
    SESSION_SECURE_COOKIE: "false"
  volumes:
    - database:/var/lib/hub
    - public_uploads:/var/www/html/storage/app/public
    - private_files:/var/www/html/storage/app/private
    - reports:/var/www/html/storage/app/reports
    - logs:/var/www/html/storage/logs
  networks:
    - internal
  init: true
  restart: unless-stopped
  stop_grace_period: 75s

services:
  app:
    <<: *application
    healthcheck:
      test: [CMD, /var/www/html/docker/fpm-health.sh]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  nginx:
    image: devops-practice-hub-nginx:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: nginx
    ports:
      - "80:80"
    volumes:
      - public_uploads:/var/www/html/storage/app/public:ro
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", http://localhost/health/ready]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 6
    restart: unless-stopped
    stop_grace_period: 15s

  worker:
    <<: *application
    command: [php, docker/worker.php]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, docker/health.php, worker]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 6

  scheduler:
    <<: *application
    command: [php, artisan, schedule:work, --no-interaction]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, docker/health.php, scheduler]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

networks:
  internal:
    internal: true

volumes:
  database:
  public_uploads:
  private_files:
  reports:
  logs:
