server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 4m;

    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 65s;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:php|phtml|phar)(?:/|$) {
        return 404;
    }

    location /storage/ {
        try_files $uri =404;
    }

    location /build/ {
        try_files $uri =404;
        expires 7d;
    }

    location ~ ^/(?:app|bootstrap|config|database|docker|resources|routes|tests|vendor)(?:/|$) {
        return 404;
    }

    location ~ ^/(?:storage/app|storage/logs|storage/framework|reports/.*\.csv)(?:/|$) {
        return 404;
    }
}
