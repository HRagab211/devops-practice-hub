version: "1.0"

services:
    app:
        container_name: laravel-devops-app
        build:
            context: .
            dockerfile: tools/docker/app/Dockerfile
            target: production-stage
        ports:
            - 9000:9000
        env_file: .env.docker
        depends_on:
            db:
                condition: service_healthy
    web:
        container_name: laravel-devops-web
        build:
            context: .
            dockerfile: tools/docker/app/Dockerfile
            target: web-stage
        ports:
            - 80:80
        depends_on:
            - app
        restart: unless-stopped
    db:
        container_name: laravel-devops-mysql
        image: mysql:8.4
        volumes:
            - dbData:/var/lib/mysql
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
            MYSQL_RANDOM_ROOT_PASSWORD: yes
        healthcheck:
            test:
            - CMD-SHELL
            - 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root --silent'
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s

        restart: unless-stopped

volumes:
    dbData:
